# Decision 2026-09-26. Updated 2026-10-18.
#
# Ignore only RUSTSEC-2024-0436 (paste 1.0.15). Do not ignore any other
# advisory. Do not turn off the whole unmaintained class.
# RUSTSEC-2026-0173 (proc-macro-error2) is not in this lock, so it is
# not ignored.
#
# Both records are RustSec type INFO, informational "unmaintained".
# They are not CVEs. The OSV records have cvss null and no CVE alias.
#
# paste (RUSTSEC-2024-0436) pastes identifiers inside a compile-time
# macro. The dtolnay/paste repo was archived on 2024-10-06. The advisory
# text is only that the project is unmaintained. It does not describe a
# vulnerability.
# https://rustsec.org/advisories/RUSTSEC-2024-0436
#
# proc-macro-error2 (RUSTSEC-2026-0173) prints compiler errors when a
# procedural macro fails. The author confirmed it is unmaintained. The
# advisory does not describe an exploitable bug. This id is
# proc-macro-error2, not age.
# https://rustsec.org/advisories/RUSTSEC-2026-0173
#
# paste entered this lock through Leptos. proc-macro-error2 did not
# remain. The management UI is the only product crate that depends on
# Leptos. Its source does not call paste. paste runs inside rustc while
# the UI is compiled. It is not in the mail server process and not in
# the running management UI process. A lockfile pin means a later
# crates.io upload does not enter the build until someone updates the
# lock.
#
# Do not vendor Leptos to clear paste.
#
# The hermetic check is flake.nix checks.*.cargo-audit. That derivation
# does not see this file. It passes --ignore RUSTSEC-2024-0436 only and
# still passes --deny warnings. This file is the same list for a local
# cargo-audit that reads .cargo/audit.toml.

[advisories]
ignore = [
  "RUSTSEC-2024-0436",
]
