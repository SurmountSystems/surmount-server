# Workspace lives at the repo root so `cargo audit` / `cargo test`
# from this directory see every crate. Do not nest a second workspace under crates/.
[workspace]
resolver = "2"
members = [
  "crates/management-ui",
  "crates/surmount-acme-namecheap",
  "crates/surmount-dns-zone",
  "crates/surmount-deploy-host",
  "crates/surmount-domain-audit",
  "crates/surmount-diskstation",
  "crates/surmount-e2e",
  "crates/surmount-host-cutover",
  "crates/surmount-host-logs",
  "crates/surmount-host-probe",
  "crates/surmount-leftover-homes",
  "crates/surmount-mail-import",
  "crates/surmount-niced-builder",
  "crates/surmount-private-data",
  "crates/surmount-rekey",
  "crates/surmount-secrets-install",
  "crates/surmount-scram",
  "crates/surmount-secrets-prompt",
  "crates/surmount-shc",
  "crates/surmount-stalwart-ops",
  "crates/surmount-static-sites",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# SPDX: https://spdx.org/licenses/Unlicense.html
license = "Unlicense"
repository = "https://github.com/SurmountSystems/surmount-server"

# Style lints that exploded under rustc 1.95 + edition 2024. Safety stays
# deny via `cargo clippy -- -D warnings` (unused, types, ETXTBSY-class bugs).
[workspace.lints.clippy]
collapsible_if = "allow"
needless_bool = "allow"
if_same_then_else = "allow"
manual_pattern_char_comparison = "allow"
too_many_arguments = "allow"
nonminimal_bool = "allow"
large_enum_variant = "allow"
unnecessary_unwrap = "allow"
manual_contains = "allow"
manual_range_contains = "allow"
while_let_on_iterator = "allow"

[workspace.dependencies]
axum = "0.8"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.13 renames the rustls-tls feature to rustls. rustls is the default TLS
# backend and uses rustls-platform-verifier for roots. use_rustls_tls() stays
# as a soft-deprecated alias. The query feature is off by default; the ACME
# hook enables it. blocking stays on the ACME crate only.
# https://github.com/seanmonstar/reqwest/blob/v0.13.5/CHANGELOG.md
# (accessed: 2026-10-17).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# No tls12 on this product feature list: the edge ServerConfig is TLS 1.3
# only. reqwest 0.13's rustls feature still turns on rustls crate feature
# tls12 for the outbound client. That does not change the edge protocol list.
# prefer-post-quantum: aws-lc-rs default provider offers hybrid X25519MLKEM768
# first. Still not live-host hybrid negotiation proof.
# 0.23.46 fixes the 0.23.45 ECH early-data leak and the key-exchange hint
# downgrade (GHSA-vp88-798v-h67f, GHSA-w44r-93j7-qv28). menhera 10d lists
# 0.23.45 and not 0.23.46 (published 2026-10-14, inside the 10-day window).
# Git [patch.crates-io] below. Do not fetch crates.io to skip the cooldown.
# https://github.com/rustls/rustls/releases/tag/v%2F0.23.46 (accessed: 2026-10-17).
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "prefer-post-quantum", "std", "logging"] }
rustls-pki-types = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
# Leptos SSR admin shell (ssr only; no csr/hydrate dual build). Locked
# 0.8.22 still depends on paste 1.0.15 (RUSTSEC-2024-0436). That advisory
# has no patched version. proc-macro-error2 (RUSTSEC-2026-0173) is not in
# this lock. Do not vendor Leptos to clear paste. 0.9 is a release
# candidate, not a product bump, and its workspace still depends on paste 1.0.
# https://rustsec.org/advisories/RUSTSEC-2024-0436 (accessed: 2026-10-18).
# https://rustsec.org/advisories/RUSTSEC-2026-0173 (accessed: 2026-10-18).
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
# Self-signed PEMs for hermetic ACME mock issuer + unit tests.
# 0.14 keeps CertificateParams::new, KeyPair::generate, self_signed,
# pem, and serialize_pem, which is the surface this tree calls.
# https://github.com/rustls/rcgen/blob/main/rcgen/CHANGELOG.md (accessed: 2026-10-17).
rcgen = "0.14"
# RUSTSEC-2026-0009: stack DoS below 0.3.47.
time = { version = "0.3.47", default-features = false }
# In-process ACME (Let's Encrypt-capable). Default features: aws-lc-rs + hyper-rustls.
# Product path: DNS-01 via DnsProvider trait. HTTP-01 on product :80 parked.
# CI never hits a live directory (MockAcmeIssuer / mock DNS only in tests).
instant-acme = "0.8.5"
# Certificate notBefore/notAfter checks for reuse-vs-reissue at startup.
x509-parser = "0.18"
# O_NOFOLLOW for ACME secret/public PEM temp opens (Linux).
libc = "0.2"
# Nostr NIP-98 verify (rust-nostr). 0.44.7+ for RUSTSEC-2026-0216..0230.
# crates.io max stable on 2026-10-17 is 0.45.5, and menhera 10d lists it.
# 0.45 drops instant (RUSTSEC-2024-0384). os-rng keeps Keys::generate.
# menhera 10d lists chacha20 0.10.2, so the git patch for that crate is gone.
# https://rustsec.org/advisories/RUSTSEC-2024-0384 (accessed: 2026-10-17).
nostr = { version = "0.45.3", default-features = false, features = ["std", "nip98", "os-rng"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
# CSRF tokens + CSP nonces (already in lock via other crates; direct dep for auth).
getrandom = "0.4"
# rage CLI is built on this library (age-encryption.org). Used by just rekey.
# 0.12.1+ pulls i18n-embed-fl 0.10.1, which uses proc-macro-error3.
# RUSTSEC-2026-0173 is proc-macro-error2, which is not in this lock.
# Identity::generate / to_public / to_string stay.
age = { version = "0.12", default-features = false }

# menhera 10d lists chacha20 0.10.2 and faster-hex 0.10.1 (checked
# 2026-10-17). Those git lines are gone. crates-io is still replaced by
# menhera. Do not fetch crates.io to skip the cooldown.
#
# rustls 0.23.46 is not on menhera 10d yet (10d stops at 0.23.45). Public
# git tag v/0.23.46, commit f04804fa13341a9b1dc02b5d1dd8a746f2c4b7fb.
# When menhera 10d lists 0.23.46, drop this rustls line.
[patch.crates-io]
rustls = { git = "https://github.com/rustls/rustls", rev = "f04804fa13341a9b1dc02b5d1dd8a746f2c4b7fb" }

