[package]
name = "surmount-management-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Surmount mail/services management console (Axum + Leptos SSR)"
publish = false

[lib]
name = "surmount_management_ui"
path = "src/lib.rs"

[[bin]]
name = "surmount-management-ui"
path = "src/main.rs"

[[bin]]
name = "surmount-nft-ban-helper"
path = "src/bin/surmount-nft-ban-helper.rs"

[dependencies]
axum.workspace = true
axum-server.workspace = true
tokio.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
# Direct dep so the HTTPS accept path can parse ClientHello SNI on failure.
# Feature-unified with axum-server's tokio-rustls 0.26 (lock).
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
# SSR-only admin shell (no hydrate / WASM / NPM). MSRV 1.88+; crane uses
# rustPackages_1_95 on nixos-26.05.
leptos.workspace = true
# rust-nostr: NIP-98 kind 27235 verify (not JS NDK / no NPM).
nostr.workspace = true
hmac.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
# In-process ACME (DNS-01). Default-off at config; live LE never required for CI.
instant-acme.workspace = true
x509-parser.workspace = true
# Hermetic mock issuer PEMs (lab SURMOUNT_ACME_DNS_PROVIDER=mock + tests).
rcgen.workspace = true
time.workspace = true
libc.workspace = true
# Vaultwarden WebSocket upgrade tunnel (already in lock via axum/reqwest).
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

[dev-dependencies]
# rcgen/time are normal deps (mock ACME issuer + expiry checks).

[lints]
workspace = true
